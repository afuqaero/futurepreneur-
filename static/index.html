<style>/* BizReady — premium SaaS dashboard styling
   Navy primary, white/light-grey surfaces, teal progress, yellow highlights. */

:root {
  /* BizReady 2.0 — blue / white / yellow, Gen-Z energy, still legible */
  --blue: #0F2A66;
  --blue-600: #1B3D86;
  --blue-700: #091D4A;
  --blue-800: #061633;
  --blue-50: #EDF1FA;
  --sun: #FFC93C;
  --sun-soft: #FFF4CB;
  --cream: #FFFBF0;

  --navy-950: #07122C;
  --navy-900: #0A1733;
  --navy-800: #15224A;
  --navy-700: #23325F;
  --navy-600: #3A4877;
  --ink: #0A1733;
  --muted: #5B6683;
  --muted-2: #8A93AD;
  --bg: #F6F7FB;
  --surface: #FFFFFF;
  --line: #E6E9F5;
  --line-strong: #D3D9EC;

  /* legacy names intentionally mapped to blue so older components reskin */
  --teal: #0F2A66;
  --teal-600: #091D4A;
  --teal-50: #EDF1FA;
  --yellow: #FFC93C;
  --yellow-50: #FFF4CB;
  --green: #0E9F6E;
  --red: #D64545;
  --red-50: #FDECEC;

  --shadow-sm: 0 1px 0 rgba(10, 23, 51, .03);
  --shadow: 0 18px 40px -26px rgba(27, 77, 255, .45);
  --shadow-lg: 0 28px 60px -30px rgba(10, 23, 51, .35);
  --radius: 20px;
  --radius-sm: 12px;
  --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display: "Bricolage Grotesque", "DM Sans", -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5 { font-family: var(--display); color: var(--navy-900); margin: 0; letter-spacing: -.02em; line-height: 1.2; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 20px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 750; }
h4 { font-size: 14px; font-weight: 750; }
p { margin: 0 0 12px; }
p:last-child { margin-bottom: 0; }
a { color: var(--navy-700); text-decoration: none; }
a:hover { color: var(--teal-600); }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }
::selection { background: #CCF0EB; color: var(--navy-900); }
:focus-visible { outline: 3px solid rgba(18, 181, 165, .38); outline-offset: 2px; border-radius: 6px; }

/* ---------------------------------------------------------------- shell */
.app { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50;
  display: flex; flex-direction: column;
  background: linear-gradient(178deg, #0A2342 0%, #0B2848 55%, #0A2038 100%);
  color: #DCE7F2; padding: 22px 16px 16px;
  border-right: 1px solid rgba(255, 255, 255, .06);
}
.sidebar::after {
  content: ""; position: absolute; right: -80px; top: 20%; width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(18, 181, 165, .16), transparent 65%);
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 22px; position: relative; z-index: 1; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  background: linear-gradient(145deg, #16C7B6, #0E9C8F);
  display: grid; place-items: center; color: #062B2A; font-family: var(--display);
  font-weight: 900; font-size: 20px; box-shadow: 0 6px 18px -6px rgba(18, 181, 165, .65);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-family: var(--display); font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -.03em; }
.brand-sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #7FA2C4; margin-top: 3px; }
.nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #6E8FB0; margin: 14px 12px 8px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 3px; position: relative; z-index: 1; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px;
  color: #C6D6E6; font-size: 13.5px; font-weight: 500; position: relative; transition: background .15s, color .15s;
}
.nav a svg { color: #8FB0CE; transition: color .15s; }
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav a.active { background: rgba(255, 255, 255, .1); color: #fff; font-weight: 650; }
.nav a.active svg { color: #2BD7C6; }
.nav a.active::before {
  content: ""; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--teal);
}
.nav .nav-count { margin-left: auto; font-size: 10.5px; background: rgba(18, 181, 165, .2); color: #6FE9DD; padding: 1px 7px; border-radius: 20px; }
.sidebar-foot { margin-top: auto; position: relative; z-index: 1; }
.side-user { display: flex; align-items: center; gap: 10px; padding: 11px; border-radius: 13px; background: rgba(255, 255, 255, .055); border: 1px solid rgba(255, 255, 255, .07); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #1B4770; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; }
.side-user .who { min-width: 0; }
.side-user .who b { display: block; font-size: 12.5px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-user .who span { font-size: 11px; color: #8FADCA; }
.icon-btn { background: transparent; border: 0; color: #9DB6CE; padding: 7px; border-radius: 8px; display: inline-grid; place-items: center; }
.icon-btn:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.side-note { font-size: 10.5px; color: #7B96B0; padding: 12px 6px 0; display: flex; gap: 6px; align-items: center; }

.main { margin-left: 260px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  height: 68px; display: flex; align-items: center; gap: 14px; padding: 0 34px;
  background: rgba(243, 246, 249, .86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30;
}
.topbar .crumb { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.topbar .crumb b { color: var(--navy-800); font-weight: 650; }
.topbar .spacer { flex: 1; }
.top-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 30px; padding: 6px 13px; font-size: 12px; font-weight: 550; color: var(--navy-800); }
.top-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
.top-chip.gold { background: var(--yellow-50); border-color: #F3E2A8; color: #775A08; }
.top-chip.gold .dot { background: #D9A400; }
.menu-btn { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; color: var(--navy-800); }
.view { padding: 30px 34px 64px; max-width: 1460px; width: 100%; }
.backdrop { display: none; }

/* ---------------------------------------------------------------- bits */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 11px; padding: 10px 17px; font-size: 13.5px; font-weight: 650;
  border: 1px solid transparent; transition: transform .06s, background .15s, box-shadow .15s, border-color .15s;
  white-space: nowrap; line-height: 1.3;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--navy-900); color: #fff; box-shadow: 0 6px 16px -8px rgba(10, 35, 66, .6); }
.btn-primary:hover { background: var(--navy-700); color: #fff; }
.btn-teal { background: var(--teal); color: #04302C; box-shadow: 0 6px 16px -8px rgba(18, 181, 165, .7); }
.btn-teal:hover { background: #16C7B6; color: #04302C; }
.btn-outline { background: var(--surface); border-color: var(--line-strong); color: var(--navy-800); }
.btn-outline:hover { border-color: #A9BCCD; background: #FBFCFE; color: var(--navy-900); }
.btn-ghost { background: transparent; color: var(--navy-700); }
.btn-ghost:hover { background: #EAF0F6; color: var(--navy-900); }
.btn-soft { background: var(--teal-50); color: #08665D; border-color: #C8ECE7; }
.btn-soft:hover { background: #D9F4EF; }
.btn-danger { background: var(--red-50); color: #A32B2B; border-color: #F6CFCF; }
.btn-danger:hover { background: #FBDDDD; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 9px; }
.btn-lg { padding: 13px 22px; font-size: 15px; border-radius: 13px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-arrow { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; font-size: 12.5px; color: var(--navy-700); white-space: nowrap; }
.link-arrow:hover { gap: 8px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-pad { padding: 24px; }
.card-pad-sm { padding: 18px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.card-head p { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.section { margin-top: 26px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head p { color: var(--muted); font-size: 13px; margin: 4px 0 0; max-width: 620px; }
.eyebrow { font-size: 10.5px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; color: var(--teal-600); margin-bottom: 8px; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 30px; padding: 4px 10px; font-size: 11.5px; font-weight: 650; background: #EDF2F7; color: #48607A; white-space: nowrap; }
.chip-teal { background: var(--teal-50); color: #08756B; }
.chip-yellow { background: var(--yellow-50); color: #7A5B06; border: 1px solid #F6E6B4; }
.chip-navy { background: #E9EFF6; color: var(--navy-700); }
.chip-red { background: var(--red-50); color: #A32B2B; }
.chip-green { background: #E6F7F0; color: #08724F; }
.chip-grey { background: #F0F3F7; color: #607187; }
.chip-outline { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.bar { height: 7px; border-radius: 10px; background: #E9EFF5; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 10px; background: var(--teal); transition: width .5s ease; }
.bar.navy > span { background: var(--navy-700); }
.bar.yellow > span { background: #E7B62A; }
.bar.slim { height: 5px; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.auto-220 { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
.auto-260 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.auto-300 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.strong { font-weight: 650; color: var(--navy-900); }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.wrap { flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.hr { height: 1px; background: var(--line); border: 0; margin: 18px 0; }
.icon-tile { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: #EDF3F8; color: var(--navy-700); }
.icon-tile.teal { background: var(--teal-50); color: #0B8276; }
.icon-tile.yellow { background: var(--yellow-50); color: #9A7308; }
.icon-tile.navy { background: #E9EFF6; color: var(--navy-800); }

/* ---------------------------------------------------------------- auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.08fr .92fr; background: var(--surface); }
.auth-art {
  position: relative; overflow: hidden; color: #fff; padding: 54px 58px;
  background: radial-gradient(1100px 620px at 82% 6%, #174B78 0%, transparent 55%), linear-gradient(155deg, #071A2F 0%, #0A2342 52%, #0C2B4E 100%);
  display: flex; flex-direction: column;
}
.auth-art::before {
  content: ""; position: absolute; width: 560px; height: 560px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .07); right: -190px; top: -150px;
}
.auth-art::after {
  content: ""; position: absolute; width: 760px; height: 760px; border-radius: 50%;
  border: 1px solid rgba(18, 181, 165, .14); right: -290px; top: -250px;
}
.auth-brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 2; }
.auth-brand .brand-name { font-size: 22px; }
.auth-copy { position: relative; z-index: 2; margin: auto 0; max-width: 520px; padding: 50px 0; }
.auth-copy h1 { color: #fff; font-size: clamp(32px, 3.5vw, 50px); line-height: 1.1; letter-spacing: -.035em; font-weight: 800; }
.auth-copy h1 em { font-style: normal; color: #4AD9CA; }
.auth-copy .lead { color: #B9CCDD; font-size: 15.5px; line-height: 1.7; margin: 20px 0 30px; max-width: 440px; }
.auth-flow { display: flex; flex-direction: column; gap: 13px; }
.auth-flow li { list-style: none; display: flex; align-items: center; gap: 13px; font-size: 13.5px; color: #CFDDEA; }
.auth-flow .num { width: 27px; height: 27px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .18); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #7FDBD2; background: rgba(18, 181, 165, .08); }
.auth-foot { color: #7895B1; font-size: 11.5px; position: relative; z-index: 2; }
.auth-panel { display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
.auth-card { width: 100%; max-width: 404px; }
.auth-card h2 { font-size: 26px; font-weight: 800; }
.auth-card .sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 24px; }
.auth-toggle { display: flex; background: #F0F4F8; border-radius: 11px; padding: 3px; margin-bottom: 22px; }
.auth-toggle button { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.auth-toggle button.on { background: #fff; color: var(--navy-900); box-shadow: var(--shadow-sm); }
.demo-box { margin-top: 22px; padding: 14px; background: #F8FAFC; border: 1px dashed var(--line-strong); border-radius: 12px; }
.demo-box .row { justify-content: space-between; }
.demo-btn { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; color: var(--navy-700); }
.demo-btn:hover { border-color: var(--teal); color: var(--teal-600); }
.auth-error { background: var(--red-50); color: #9B2C2C; border: 1px solid #F3CACA; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; margin-bottom: 14px; }

/* ---------------------------------------------------------------- forms */
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 12px; font-weight: 650; color: var(--navy-800); margin-bottom: 6px; }
.field .hint { font-size: 11.5px; color: var(--muted-2); margin-top: 5px; }
.input, .select, .textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff;
  padding: 10px 12px; font-size: 13.5px; color: var(--ink); transition: border .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(18, 181, 165, .12); outline: none; }
.textarea { resize: vertical; min-height: 94px; line-height: 1.55; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checkbox { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink); }
.checkbox input { width: 16px; height: 16px; accent-color: var(--teal-600); }
.form-note { font-size: 11.5px; color: var(--muted); }

/* ---------------------------------------------------------------- hero/dashboard */
.hero {
  position: relative; overflow: hidden; border-radius: 22px; color: #fff; padding: 30px 34px;
  background: radial-gradient(900px 420px at 92% -10%, #1B527F 0%, transparent 58%), linear-gradient(130deg, #0A2342, #0C2C50 65%, #0D3358);
  box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: space-between; gap: 28px;
}
.hero::after {
  content: ""; position: absolute; right: -70px; bottom: -160px; width: 420px; height: 420px; border-radius: 50%;
  border: 1px solid rgba(18, 181, 165, .2); box-shadow: 0 0 0 40px rgba(18, 181, 165, .03), 0 0 0 90px rgba(255, 255, 255, .02);
  pointer-events: none;
}
.hero .eyebrow { color: #7CE3D8; }
.hero h1 { color: #fff; font-size: clamp(25px, 2.6vw, 33px); margin-bottom: 8px; }
.hero p { color: #B9CDDF; font-size: 13.5px; max-width: 560px; margin: 0 0 18px; }
.hero .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hero .ghost-link { color: #C9DBEA; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.hero .ghost-link:hover { color: #fff; }
.hero-ring { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; padding-right: 8px; }
.hero-ring .ring-label { font-size: 11px; color: #9FBBD4; letter-spacing: .06em; text-transform: uppercase; }

.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .ring-track { stroke: rgba(255, 255, 255, .14); }
.ring.light .ring-track { stroke: #E8EEF4; }
.ring .ring-val { stroke: #2BD7C6; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring.light .ring-val { stroke: var(--teal); }
.ring .ring-txt { position: absolute; text-align: center; line-height: 1.05; }
.ring .ring-txt b { display: block; font-family: var(--display); font-size: 25px; font-weight: 800; color: #fff; }
.ring .ring-txt span { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #9FBBD4; }
.ring.light .ring-txt b { color: var(--navy-900); }
.ring.light .ring-txt span { color: var(--muted); }

.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 17px 18px; box-shadow: var(--shadow-sm); }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.stat .v { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--navy-900); letter-spacing: -.03em; margin-top: 7px; line-height: 1; }
.stat .v small { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.stat .s { font-size: 11.5px; color: var(--muted); margin-top: 7px; }

.journey { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: var(--shadow-sm); }
.jstep { position: relative; display: flex; align-items: center; gap: 10px; padding: 11px 10px; border-radius: 12px; min-width: 0; }
.jstep:hover { background: #F8FAFD; }
.jstep .jdot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 750; flex: none; background: #EFF4F8; color: #7A8FA5; }
.jstep.done .jdot { background: var(--teal); color: #053B36; }
.jstep.current .jdot { background: var(--navy-900); color: #fff; box-shadow: 0 0 0 4px rgba(10, 35, 66, .1); }
.jstep .jt { min-width: 0; }
.jstep .jt b { display: block; font-size: 11.5px; font-weight: 650; color: var(--navy-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jstep .jt span { display: block; font-size: 10px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.action-item { display: flex; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }

.action-item .num { width: 25px; height: 25px; border-radius: 8px; background: var(--teal-50); color: #08756B; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; margin-top: 1px; }
.action-item .txt { flex: 1; min-width: 0; }
.action-item b { display: block; font-size: 12.8px; color: var(--navy-900); font-weight: 650; line-height: 1.35; }
.action-item span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.action-item .go { color: #A9B8C7; margin-top: 3px; }

.comp-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.comp-row:last-child { border-bottom: 0; }
.comp-row .swatch { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 750; background: #EEF3F8; color: #5B7288; flex: none; }

.comp-row .sc { width: 42px; text-align: right; font-size: 12px; font-weight: 700; color: var(--navy-800); }
.comp-row .bar { width: 84px; flex: none; }

.ai-teaser { background: linear-gradient(150deg, #0C2B4D, #123C64); color: #fff; border: 0; position: relative; overflow: hidden; }
.ai-teaser::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(18, 181, 165, .25), transparent 70%); }
.ai-teaser h3 { color: #fff; }
.ai-teaser p { color: #B7CBDE; font-size: 12.5px; }

/* ---------------------------------------------------------------- checkup */
.profile-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 13px; overflow: hidden; border: 1px solid var(--line); }
.profile-summary div { background: #fff; padding: 13px 16px; }
.profile-summary .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.profile-summary .v { font-size: 13px; color: var(--navy-900); font-weight: 600; margin-top: 3px; }
.diag-intro { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 26px; align-items: center; }
.diag-cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.diag-cat { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.diag-cat .num { font-size: 9.5px; font-weight: 750; color: var(--teal-600); background: var(--teal-50); border-radius: 5px; padding: 2px 5px; }

.runner { max-width: 780px; margin: 0 auto; }
.runner-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.runner-meta { font-size: 12px; color: var(--muted); font-weight: 600; }
.runner-meta b { color: var(--navy-900); }
.qcard { padding: 30px 32px; }
.qcard .topic { margin-bottom: 10px; }
.qcard h2 { font-size: 20px; line-height: 1.4; margin-bottom: 22px; letter-spacing: -.01em; }
.options { display: grid; gap: 9px; }
.option {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  background: #fff; border: 1px solid var(--line-strong); border-radius: 12px; padding: 13px 15px;
  font-size: 13.5px; color: var(--ink); line-height: 1.45; transition: border .12s, background .12s, box-shadow .12s;
}
.option:hover { border-color: #A8C3D8; background: #FBFCFE; }
.option .letter { width: 24px; height: 24px; border-radius: 7px; background: #F0F4F8; color: #5B7288; display: grid; place-items: center; font-size: 11px; font-weight: 750; flex: none; }
.option.sel { border-color: var(--teal); background: #F3FCFA; box-shadow: 0 0 0 3px rgba(18, 181, 165, .1); }
.option.sel .letter { background: var(--teal); color: #04302C; }
.option.correct { border-color: #9FDCC4; background: #F0FBF6; }
.option.correct .letter { background: var(--green); color: #fff; }
.option.wrong { border-color: #F0BDBD; background: #FEF6F6; }
.option.wrong .letter { background: var(--red); color: #fff; }
.option.review { cursor: default; }
.qnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
.answer-dots { display: flex; gap: 4px; flex-wrap: wrap; }
.answer-dot { width: 8px; height: 8px; border-radius: 50%; background: #DCE5EE; }
.answer-dot.done { background: var(--teal); }
.answer-dot.cur { background: var(--navy-800); box-shadow: 0 0 0 3px rgba(10, 35, 66, .12); }

.result-hero { display: flex; gap: 26px; align-items: center; padding: 28px 30px; }
.result-hero .copy { flex: 1; }
.result-hero h2 { font-size: 23px; margin-bottom: 8px; }
.result-hero p { color: var(--muted); font-size: 13px; }
.score-badge { text-align: center; min-width: 118px; }
.score-badge .num { font-family: var(--display); font-size: 40px; font-weight: 800; color: var(--navy-900); letter-spacing: -.04em; line-height: 1; }
.score-badge .num small { font-size: 15px; color: var(--muted); }
.score-badge .lbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.priority-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: #fff; }
.priority-card.top { border-color: #F0D99A; background: linear-gradient(180deg, #FFFCF3, #fff); }

.band-list { display: grid; gap: 11px; }
.band { display: grid; grid-template-columns: 150px 1fr 46px; gap: 12px; align-items: center; }
.band .nm { font-size: 12.5px; font-weight: 550; color: var(--navy-800); }
.band .vl { font-size: 12px; font-weight: 700; color: var(--navy-900); text-align: right; }

/* ---------------------------------------------------------------- learn */
.comp-card { position: relative; border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 19px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s, transform .15s, border-color .15s; }
.comp-card.available:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #C9DBE9; }
.comp-card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.comp-card .idx { width: 34px; height: 34px; border-radius: 10px; background: #EDF3F8; color: var(--navy-700); display: grid; place-items: center; font-size: 11.5px; font-weight: 750; }
.comp-card h3 { font-size: 15px; line-height: 1.3; }
.comp-card p { font-size: 12.3px; color: var(--muted); margin: 0; line-height: 1.5; }
.comp-card .topics { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.comp-card .topics span { font-size: 10.3px; color: #6D8197; background: #F5F8FB; padding: 3px 7px; border-radius: 6px; }
.comp-card .foot { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.comp-card .foot .meta { font-size: 11px; color: var(--muted-2); }
.ribbon { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 750; color: #8A6A0A; background: var(--yellow-50); border: 1px solid #F6E6B4; padding: 3px 7px; border-radius: 5px; }

.module-hero { padding: 30px 32px; border-radius: 20px; background: linear-gradient(130deg, #0B2848, #10395F); color: #fff; position: relative; overflow: hidden; }
.module-hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(18, 181, 165, .25); }
.module-hero h1 { color: #fff; font-size: clamp(24px, 2.4vw, 31px); margin: 8px 0 10px; }
.module-hero p { color: #BDD0E1; max-width: 720px; font-size: 13.5px; }
.module-hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.module-hero .chip { background: rgba(255, 255, 255, .1); color: #DCEBF7; border: 1px solid rgba(255, 255, 255, .12); }
.checkpoint-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.checkpoint { border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; background: #fff; display: flex; gap: 10px; align-items: flex-start; }
.checkpoint.done { border-color: #BFE9DB; background: #F6FDFA; }
.checkpoint .tick { width: 21px; height: 21px; border-radius: 50%; background: #EEF3F8; color: #8DA0B3; display: grid; place-items: center; flex: none; font-size: 10px; font-weight: 800; }
.checkpoint.done .tick { background: var(--teal); color: #04302C; }
.checkpoint b { display: block; font-size: 12px; color: var(--navy-900); }
.checkpoint span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }

.lesson { background: #fff; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; margin-bottom: 10px; }
.lesson summary { list-style: none; cursor: pointer; padding: 17px 20px; display: flex; align-items: center; gap: 14px; }
.lesson summary::-webkit-details-marker { display: none; }
.lesson summary:hover { background: #FBFCFE; }
.lesson .lnum { width: 30px; height: 30px; border-radius: 9px; background: #EEF3F8; color: var(--navy-700); display: grid; place-items: center; font-size: 11.5px; font-weight: 750; flex: none; }
.lesson.done .lnum { background: var(--teal-50); color: #08756B; }
.lesson .lsum { flex: 1; min-width: 0; }
.lesson .lsum b { display: block; font-size: 14px; font-family: var(--display); color: var(--navy-900); font-weight: 750; }
.lesson .lsum span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.lesson .lmeta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted-2); }
.lesson .chev { transition: transform .2s; color: #91A4B7; }
.lesson[open] .chev { transform: rotate(180deg); }
.lesson-body { padding: 4px 22px 24px 64px; border-top: 1px solid var(--line); margin-top: 2px; padding-top: 20px; }
.lesson-body .prose p { font-size: 13.8px; line-height: 1.72; color: #2B3F55; margin-bottom: 12px; }
.example-box { background: #F6FAFD; border: 1px solid #DDE9F2; border-left: 3px solid var(--navy-600); border-radius: 10px; padding: 15px 17px; margin: 16px 0; }
.example-box .lbl { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--navy-600); font-weight: 750; margin-bottom: 6px; }
.example-box h4 { margin-bottom: 5px; font-size: 13px; }
.example-box p { margin: 0; font-size: 12.6px; color: #3C526A; line-height: 1.65; }
.pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.pair-box { border-radius: 11px; padding: 14px 16px; border: 1px solid var(--line); }
.pair-box.do { background: #F5FCF9; border-color: #CDEDE0; }
.pair-box.dont { background: #FEF8F6; border-color: #F3D9D2; }
.pair-box.why { background: #F8FAFC; border-color: var(--line); }
.pair-box.mistakes { background: #FFFBEF; border-color: #F2E5BB; }
.pair-box h5 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; font-family: var(--font); font-weight: 750; margin-bottom: 7px; }
.pair-box.do h5 { color: #087A55; }
.pair-box.dont h5 { color: #B33A2F; }
.pair-box.why h5 { color: var(--navy-700); }
.pair-box.mistakes h5 { color: #9A7308; }
.pair-box ul { margin: 0; padding-left: 16px; }
.pair-box li { font-size: 12.2px; line-height: 1.55; color: #40556B; margin-bottom: 4px; }
.pair-box li:last-child { margin-bottom: 0; }
.exercise-box { border: 1px dashed #B9CEDF; border-radius: 12px; padding: 16px 18px; background: #FBFDFF; margin: 16px 0 4px; }
.exercise-box h4 { font-size: 12.5px; display: flex; align-items: center; gap: 7px; }
.exercise-box ol { margin: 8px 0 0; padding-left: 18px; }
.exercise-box li { font-size: 12.2px; color: #465C72; line-height: 1.55; margin-bottom: 3px; }
.lesson-foot { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); }
.template-row { display: flex; align-items: center; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.template-row:last-child { border-bottom: 0; }
.template-row .fname { font-size: 12.3px; font-weight: 600; color: var(--navy-900); }
.template-row .fmeta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.template-row .dl { margin-left: auto; }
.file-icon { width: 34px; height: 38px; border-radius: 6px; background: #EEF4F9; border: 1px solid #DDE8F1; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #59748B; letter-spacing: .04em; }

/* ---------------------------------------------------------------- test hub */
.assessment-card { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 16px; background: #fff; border: 1px solid var(--line); position: relative; overflow: hidden; }
.assessment-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--teal); opacity: .8; }
.assessment-card.yellow::before { background: var(--yellow); }
.assessment-card.navy::before { background: var(--navy-600); }
.assessment-card .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.assessment-card h3 { font-size: 16px; }
.assessment-card p { font-size: 12.5px; color: var(--muted); margin: 0; }
.assessment-card .meta-row { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.assessment-card .meta-row b { color: var(--navy-800); }
.assessment-card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.verdict { display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-radius: 16px; border: 1px solid #BFE9DB; background: linear-gradient(100deg, #F2FCF8, #fff); }
.verdict.fail { border-color: #F3D2C8; background: linear-gradient(100deg, #FFF8F5, #fff); }
.verdict .vicon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; flex: none; }
.verdict.fail .vicon { background: #DD6B55; }
.verdict h3 { font-size: 16px; }
.verdict p { font-size: 12.5px; color: var(--muted); margin: 3px 0 0; }
.feedback-list { display: grid; gap: 10px; }
.feedback { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fff; }
.feedback.ok { border-left: 3px solid var(--green); }
.feedback.no { border-left: 3px solid var(--red); }
.feedback .fq { font-size: 12.8px; font-weight: 600; color: var(--navy-900); }
.feedback .fa { font-size: 11.8px; margin-top: 5px; color: var(--muted); }
.feedback .fa b { color: var(--navy-800); }
.feedback .fe { font-size: 11.8px; margin-top: 6px; color: #46607A; background: #F7FAFC; padding: 8px 10px; border-radius: 7px; }

/* ---------------------------------------------------------------- progress */
.level-card { background: linear-gradient(140deg, #0B2848, #10395F); color: #fff; border-radius: 18px; padding: 24px; position: relative; overflow: hidden; }
.level-card h3 { color: #fff; }
.level-card p { color: #B7CBDD; font-size: 12.5px; }
.level-scale { display: flex; gap: 5px; margin: 16px 0 8px; }
.level-scale span { flex: 1; height: 5px; border-radius: 4px; background: rgba(255, 255, 255, .18); }
.level-scale span.on { background: var(--teal); }
.level-labels { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: #87A5C0; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 0 12px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; color: #334A61; }
.table tr:last-child td { border-bottom: 0; }
.table td b { color: var(--navy-900); font-weight: 650; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }
.table .bar { width: 64px; flex: none; }
.table .comp-name { min-width: 170px; }
.mastery-pill { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; background: #EFF4F8; color: #5B7288; white-space: nowrap; }
.mastery-pill.optimising { background: #E2F8F2; color: #08745A; }
.mastery-pill.structured { background: #E7F0FA; color: #245C8D; }
.mastery-pill.developing { background: #FFF5D9; color: #8A6608; }
.mastery-pill.beginner { background: #FDF0EA; color: #A85A36; }
.mastery-pill.not-assessed { background: #F2F5F8; color: #8A9AAB; }

.checklist { display: grid; gap: 0; }
.checklist-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.checklist-row:last-child { border-bottom: 0; }
.checklist-row .tick { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #F0F4F8; color: #9AABBC; font-size: 10px; }
.checklist-row.done .tick { background: var(--teal); color: #04302C; }
.checklist-row .txt { flex: 1; font-size: 12.5px; color: var(--navy-800); }
.checklist-row .txt span { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
.checklist-row .st { font-size: 10.5px; font-weight: 700; color: var(--muted-2); }

.plan-item { display: flex; gap: 13px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.plan-item:last-child { border-bottom: 0; }
.plan-check { width: 21px; height: 21px; border-radius: 6px; border: 1.5px solid #BCCBD9; background: #fff; flex: none; display: grid; place-items: center; color: transparent; margin-top: 1px; padding: 0; }
.plan-check:hover { border-color: var(--teal); }
.plan-item.done .plan-check { background: var(--teal); border-color: var(--teal); color: #04302C; }
.plan-item .pt { flex: 1; min-width: 0; }
.plan-item .pt b { display: block; font-size: 12.8px; color: var(--navy-900); font-weight: 600; }
.plan-item.done .pt b { color: #7D8FA1; text-decoration: line-through; }
.plan-item .pt p { font-size: 11.8px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.plan-item .pt .due { font-size: 10.5px; color: var(--muted-2); margin-top: 5px; display: inline-flex; gap: 4px; align-items: center; }
.plan-del { background: none; border: 0; color: #B4C2CF; padding: 3px; border-radius: 6px; }
.plan-del:hover { color: var(--red); background: var(--red-50); }
.inline-form { display: grid; grid-template-columns: minmax(0, 1.6fr) 150px auto; gap: 8px; margin-top: 14px; }

/* ---------------------------------------------------------------- coach */
.coach-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.chat-card { display: flex; flex-direction: column; height: calc(100vh - 172px); min-height: 520px; overflow: hidden; }
.chat-head { padding: 15px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.chat-head .avatar-bot { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(150deg, #0E2E52, #17507C); color: #6FE9DD; display: grid; place-items: center; flex: none; }
.chat-head b { font-family: var(--display); font-size: 14.5px; color: var(--navy-900); display: block; }
.chat-head span { font-size: 11px; color: var(--muted); }
.chat-modes { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #FBFCFE; flex-wrap: wrap; align-items: center; }
.chat-demo { padding: 12px 18px 0; }
.mode-btn { border: 1px solid var(--line-strong); background: #fff; border-radius: 30px; padding: 6px 12px; font-size: 11.5px; font-weight: 650; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.mode-btn.on { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }
.mode-hint { font-size: 10.5px; color: var(--muted-2); margin-left: auto; }
.chat-body { flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
.bubble { max-width: 84%; display: flex; gap: 9px; align-items: flex-start; }
.bubble .bsym { width: 27px; height: 27px; border-radius: 8px; background: #EAF1F7; color: var(--navy-700); display: grid; place-items: center; font-size: 10px; font-weight: 800; flex: none; margin-top: 2px; }
.bubble .bcontent { background: #F4F7FA; border: 1px solid #E7EDF4; border-radius: 4px 14px 14px 14px; padding: 13px 16px; font-size: 13px; line-height: 1.65; color: #263B50; overflow-wrap: anywhere; }
.bubble .bcontent p { margin: 0 0 9px; }
.bubble .bcontent p:last-child { margin-bottom: 0; }
.bubble .bcontent strong { color: var(--navy-900); font-weight: 700; }
.bubble .bcontent ul { margin: 4px 0 9px; padding-left: 17px; }

<script>/* futurePreneur — frontend application (vanilla JS, hash router, server-backed) */
'use strict';

/* ------------------------------------------------------------------ utils */
const $ = (sel, root = document) => root.querySelector(sel);
const $ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const state = {
  user: null,
  progress: null,
  components: [],
  settings: {},
  ai: { configured: false, mode: 'demo' },
  authMode: 'login',
  authError: '',
  authBusy: false,
  editProfile: false,
  checkupResult: null,
  runner: null,
  assessmentResult: null,
  practicalForm: false,
  practicalModule: 'strategy',
  moduleData: null,
  coach: { mode: 'teach', messages: [], busy: false, sessionId: null, sessions: [], loaded: false },
  admin: { tab: 'learners', qkind: 'all', editing: null, showForm: false, lesson: 'l1', content: null, moduleId: null, template: null, newModule: false, newTemplate: false, preview: false },
};
let seq = 0;
let lastRoute = '';

function begin() { return ++seq; }

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' +
    d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

function masteryClass(level) {
  return String(level || 'Not assessed').toLowerCase().replace(/\s+/g, '-');
}

function compName(id) {
  const c = state.components.find(x => x.id === id);
  return c ? c.name : id;
}

function compMeta(id) {
  return state.components.find(x => x.id === id) || { name: id, short: id, available: false };
}

const DIAG_RECS = {
  strategy: 'Start with the Business Strategy & Model module: define one primary customer, write your value proposition, and calculate contribution per sale.',
  marketing: 'Write down your single best customer group and the one offer you want them to buy. Then track where enquiries come from for two weeks.',
  operations: 'Map your busiest process on one page, mark the two points where mistakes happen, and add a simple check at each point.',
  finance: 'Separate fixed and variable costs, then calculate your break-even sales. Review cash in and cash out weekly.',
  people: 'Clarify each role in one page: what good looks like, what decisions they can make, and who checks quality.',
  systems: 'Turn your most repeated task into a one-page checklist and test it with someone else doing the task.',
  legal: 'List the licences, contracts and insurance your business depends on, and note the renewal dates in one place.',
  digital: 'Choose one digital channel, measure cost per order and repeat orders for 30 days, and drop anything you cannot measure.',
};

/* Owner-facing grouping of the eight diagnostic components. Scores are
   diagnostic baselines only; verified badges come from passed modules. */
const ASPECTS = [
  { id: 'marketing', label: 'Marketing', components: ['marketing'], blurb: 'Customers, offer, channels and repeat sales' },
  { id: 'finance', label: 'Finance', components: ['finance'], blurb: 'Cash, margins and pricing decisions' },
  { id: 'operations', label: 'Operations', components: ['operations'], blurb: 'Quality, capacity and reliable delivery' },
  { id: 'management', label: 'Management', components: ['strategy', 'systems'], blurb: 'Direction, priorities and how work gets done' },
  { id: 'people-growth', label: 'People & Growth', components: ['people', 'digital'], blurb: 'Team, digital tools and expansion' },
];

function aspectSummary(progress, aspect) {
  const comps = aspect.components.map((id) => progress.components.find((c) => c.id === id)).filter(Boolean);
  const scored = comps.filter((c) => typeof c.score === 'number');
  const score = scored.length ? Math.round(scored.reduce((sum, c) => sum + c.score, 0) / scored.length) : null;
  const verified = comps.filter((c) => c.status === 'passed').length;
  return { score, verified, total: comps.length };
}

function cookieValue(name) {
  const match = document.cookie.split('; ').find((row) => row.startsWith(name + '='));
  return match ? decodeURIComponent(match.slice(name.length + 1)) : '';
}

async function readBody(res) {
  const type = res.headers.get('content-type') || '';
  return type.includes('application/json') ? res.json() : res.text();
}

async function api(path, options = {}) {
  const opts = Object.assign({ credentials: 'same-origin' }, options);
  const method = (opts.method || 'GET').toUpperCase();
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});

  // Every state-changing request needs the double-submit CSRF token.
  if (method !== 'GET' && !cookieValue('br_csrf')) {
    await fetch('/api/bootstrap', { credentials: 'same-origin' });
  }
  if (method !== 'GET') opts.headers['X-CSRF-Token'] = cookieValue('br_csrf');

  let res = await fetch(path, opts);
  let data = await readBody(res);

  if (res.status === 403 && data && data.code === 'csrf_invalid') {
    await fetch('/api/bootstrap', { credentials: 'same-origin' });
    opts.headers['X-CSRF-Token'] = cookieValue('br_csrf');
    res = await fetch(path, opts);
    data = await readBody(res);
  }

  if (!res.ok) {
    if (res.status === 401 && state.user) {
      state.user = null;
      state.progress = null;
      renderAuth();
    }
    throw new Error((data && data.error) || 'Request failed.');
  }
  return data;
}

function toast(message, kind = '') {
  const wrap = $('#toast');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast-item ' + kind;
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; }, 3200);
  setTimeout(() => el.remove(), 3500);
}

function icon(name, size = 18) {

}

function ring(pct, size = 118, stroke = 9, label = 'complete', light = false) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - p / 100);
  return `<div class="ring ${light ? 'light' : ''}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="ring-track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="ring-val" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="ring-txt"><b>${p}%</b><span>${esc(label)}</span></div>
  </div>`;
}

function bar(pct, cls = '') {
  return `<div class="bar ${cls}"><span style="width:${Math.max(0, Math.min(100, Number(pct) || 0))}%"></span></div>`;
}

function sparkline(points) {
  if (!points || !points.length) return '';
  const width = 620, height = 140, padX = 26, padY = 18;
  const innerW = width - padX * 2, innerH = height - padY * 2;
  const step = points.length > 1 ? innerW / (points.length - 1) : 0;
  const x = i => padX + (points.length > 1 ? i * step : innerW / 2);
  const y = value => padY + innerH * (1 - Math.max(0, Math.min(100, value)) / 100);
  const coords = points.map((p, i) => `${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(' ');
  return `<svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Assessment score trend">
    <line class="trend-grid" x1="${padX}" y1="${y(100)}" x2="${width - padX}" y2="${y(100)}"/>
    <line class="trend-grid" x1="${padX}" y1="${y(0)}" x2="${width - padX}" y2="${y(0)}"/>
    <line class="trend-high" x1="${padX}" y1="${y(80)}" x2="${width - padX}" y2="${y(80)}"/>
    <line class="trend-mid" x1="${padX}" y1="${y(70)}" x2="${width - padX}" y2="${y(70)}"/>
    <text class="trend-label" x="${padX}" y="${y(100) - 5}">100</text>
    <text class="trend-label" x="${padX}" y="${y(0) + 12}">0</text>
    <polyline class="trend-line" points="${coords}"/>
    ${points.map((p, i) => `<circle class="trend-dot ${p.passed ? 'pass' : 'fail'}" cx="${x(i)}" cy="${y(p.score)}" r="4.5">
      <title>${esc(p.module_title || '')} · ${esc(p.kind)} · ${p.score}% · ${fmtDate(p.created_at)}</title>
    </circle>`).join('')}
  </svg>`;
}

async function doLogin(email, password) {
  state.authBusy = true;
  state.authError = '';
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    state.user = data.user;
    state.progress = data.progress;
    state.authError = '';
    state.authMode = 'login';
    const target = data.user.role === 'admin' ? '#/admin' : '#/dashboard';
    if (location.hash === target) router(); else location.hash = target;
  } catch (err) {
    state.authError = err.message;
    renderAuth();
  } finally {
    state.authBusy = false;
  }
}

async function doRegister(form) {
  state.authError = '';
  const payload = {
    name: form.elements.name.value.trim(),
    email: form.elements.email.value.trim(),
    password: form.elements.password.value,
  };
  try {
    const data = await api('/api/auth/register', { method: 'POST', body: JSON.stringify(payload) });
    state.user = data.user;
    state.progress = data.progress;
    location.hash = '#/checkup';
    router();
  } catch (err) {
    state.authError = err.message;
    renderAuth();
  }
}

async function router() {
  if (!state.user) { renderAuth(); return; }
  const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const parts = raw.split('/').filter(Boolean);
  const root = parts[0] || 'dashboard';
  const sub = parts[1] || '';
  const kind = parts[2] || '';
  const navKey = root === 'module' ? 'learn' : root;
  const titles = {
    dashboard: 'Dashboard',
    checkup: 'Business Check-Up',
    learn: sub === 'strategy' ? 'Business Strategy & Model' : 'Learn & Improve',
    coach: 'AI Business Coach',
    test: kind === 'practical' ? 'Practical assignment' : kind === 'quiz' ? 'Knowledge quiz' : kind === 'scenario' ? 'Scenario test' : 'Test Your Skills',
    progress: 'My Business Progress',
    admin: 'Admin',
  };
  document.title = (titles[root] || 'Workspace') + ' · futurePreneur';
  renderShell(['dashboard', 'checkup', 'learn', 'coach', 'test', 'progress', 'admin'].includes(navKey) ? navKey : 'dashboard');
  const my = begin();
  if (raw !== lastRoute) {
    state.assessmentResult = (root === 'test' && kind) ? state.assessmentResult : null;
    lastRoute = raw;
  }
  const view = $('#view');
  if (view) view.innerHTML = loadingHTML();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  try {
    if (root === 'dashboard') await viewDashboard(my);
    else if (root === 'checkup') await viewCheckup(my);
    else if (root === 'learn' && sub) await viewModule(my, sub, parts[2] || '');
    else if (root === 'learn') await viewLearn(my);
    else if (root === 'coach') await viewCoach(my);
    else if (root === 'test') await viewTest(my, sub, kind);
    else if (root === 'progress') await viewProgress(my);
    else if (root === 'admin') await viewAdmin(my, sub);
    else notFound(my);
  } catch (err) {
    mount(errorHTML(err.message), my);
  }
}

function deltaChip(value) {
  if (value == null || value === 0) return '';
  const up = value > 0;
  return `<span class="chip ${up ? 'chip-teal' : 'chip-red'}" title="Change since your previous check-up">${up ? '+' : ''}${value}</span>`;
}

function checkupResults(data, profile, history = []) {
  const result = data.result || data;
  const scores = result.components || {};
  const change = data.change || null;
  const previous = data.previous || null;
  const ranked = Object.keys(scores).sort((a, b) => scores[a] - scores[b]);
  const priorities = data.priorities || ranked.slice(0, 3).map(id => ({
    component: id, name: compName(id), score: scores[id], recommendation: DIAG_RECS[id],
    available: compMeta(id).available, module_id: compMeta(id).module_id || null, lessons: [],
  }));
  const strengths = data.strengths || ranked.slice(-2).reverse().map(id => ({ component: id, name: compName(id), score: scores[id] }));
  const firstModule = priorities.find(pr => pr.available && pr.module_id);
  return `
  <div class="card result-hero">
    <div class="copy">
      <div class="eyebrow">Business Check-Up · ${fmtDate(result.created_at)}</div>
      <h2>${result.overall >= 70 ? 'A solid base — now make it systematic.' : result.overall >= 50 ? 'Practical experience, uneven structure.' : 'You have room to build strong foundations.'}</h2>

      ${change ? `<div class="row wrap" style="gap:7px;margin-top:10px">

      </div>` : ''}
      <div class="row wrap" style="gap:8px;margin-top:14px">
        <a class="btn btn-primary btn-sm" href="#/learn/${firstModule ? esc(firstModule.module_id) : 'strategy'}">${firstModule ? `Start ${esc(firstModule.name)}` : 'Start Business Strategy & Model'} ${icon('right', 13)}</a>

    </div>
    <div class="score-badge">${ring(result.overall, 122, 9, 'diagnostic', true)}</div>
  </div>

  <div class="section">
    <div class="section-head"><div><h2>Recommended learning priorities</h2><p>Areas scoring below 85% where a small change is likely to help most.</p></div></div>
    ${priorities.length ? `<div class="grid auto-260">
      ${priorities.map((pr, i) => `<div class="priority-card ${i === 0 ? 'top' : ''}">

        <p>${esc(pr.recommendation)}</p>
        ${pr.available && pr.module_id ? `<a class="link-arrow" href="#/learn/${esc(pr.module_id)}">Start the module ${icon('right', 12)}</a>
          ${pr.lessons && pr.lessons.length ? `<div class="tiny muted" style="margin-top:6px">Starts with: ${pr.lessons.map(esc).join(' · ')}</div>` : ''}`
          : `<span class="chip chip-grey">Module in development</span>`}
      </div>`).join('')}
    </div>` : `<div class="card card-pad">
      <p class="small" style="margin:0 0 10px"><b>No urgent gaps.</b> Every component scored 85% or higher. Pick one area to deepen rather than chasing a weakness.</p>
      <a class="btn btn-outline btn-sm" href="#/learn">Open the modules ${icon('right', 13)}</a>
    </div>`}
  </div>

  <div class="section split">
    <div class="card card-pad">
      <div class="card-head"><div><h2>Component breakdown</h2><p>Knowledge and practice across all eight areas.</p></div></div>
      <div class="band-list">
        ${Object.keys(scores).map(id => `<div class="band">

          ${bar(scores[id], scores[id] >= 70 ? '' : scores[id] >= 50 ? 'yellow' : 'navy')}

function runnerHTML() {
  const r = state.runner;
  const q = r.questions[r.index];

  const dots = r.questions.map((qq, i) => `<span class="answer-dot ${r.answers[qq.id] !== undefined ? 'done' : ''} ${i === r.index ? 'cur' : ''}"></span>`).join('');
  const pct = Math.round((Object.keys(r.answers).length / total) * 100);
  return `<div class="runner">
    <div class="runner-top">
      <div>
        <div class="eyebrow" style="margin-bottom:3px">${titles[r.type]}</div>
        <div class="runner-meta">${subtitle} · Question <b>${r.index + 1}</b> of ${total}${r.pass_mark ? ` · pass mark ${r.pass_mark}%` : ''}</div>
      </div>
      <button class="btn btn-ghost btn-sm" type="button" data-action="exit-runner">${icon('close', 14)} Exit</button>
    </div>
    <div class="row" style="gap:12px;margin-bottom:8px">
      <div style="flex:1">${bar(pct)}</div>
      <span class="tiny muted" style="width:34px;text-align:right">${pct}%</span>
    </div>
    <div class="answer-dots" style="margin-bottom:14px">${dots}</div>
    <div class="card qcard fade-in">
      <div class="row wrap" style="gap:6px;margin-bottom:10px">
        <span class="chip chip-navy">${esc(compName(q.component))}</span>
        <span class="chip chip-grey">${esc(q.topic)}</span>
      </div>
      <h2>${esc(q.prompt)}</h2>
      <div class="options">
        ${q.options.map((o, i) => `<button type="button" class="option ${selected === i ? 'sel' : ''}" data-action="answer" data-i="${i}">
          <span class="letter">${'ABCDEF'[i]}</span><span>${esc(o)}</span></button>`).join('')}
      </div>
      <div class="qnav">
        <button class="btn btn-ghost" type="button" data-action="runner-back" ${r.index === 0 ? 'disabled' : ''}>${icon('left', 14)} Back</button>
        <span class="tiny muted">${selected !== undefined ? 'Answer selected' : 'Choose one answer'}</span>
        ${r.index === total - 1
          ? `<button class="btn btn-teal" type="button" data-action="runner-submit">Submit ${r.type === 'checkup' ? 'check-up' : 'answers'} ${icon('check', 14)}</button>`

      </div>
    </div>
    <p class="tiny muted center" style="margin-top:14px">Answers are scored on the server. You can move back and change an answer before submitting.</p>
  </div>`;
}

function renderRunner() {
  const my = begin();
  mount(runnerHTML(), my);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function startCheckup() {
  try {
    const data = await api('/api/checkup');
    state.runner = { type: 'checkup', questions: data.questions, index: 0, answers: {} };
    state.checkupResult = null;
    renderRunner();
  } catch (err) { toast(err.message, 'err'); }
}

async function startAssessment(kind, moduleId = 'strategy') {
  try {
    const data = await api('/api/module/' + encodeURIComponent(moduleId) + '/assessment/' + kind + '/questions');
    state.assessmentResult = null;
    state.runner = {
      type: kind, questions: data.questions, index: 0, answers: {},
      pass_mark: data.pass_mark, history: data.history,
      module_id: moduleId, module_title: data.module.title,
    };
    renderRunner();
  } catch (err) { toast(err.message, 'err'); }
}

async function submitRunner() {
  const r = state.runner;
  if (!r) return;
  const unanswered = r.questions.filter(q => r.answers[q.id] === undefined);
  if (unanswered.length) {
    r.index = r.questions.findIndex(q => r.answers[q.id] === undefined);
    renderRunner();
    toast('Please answer all questions before submitting. ' + unanswered.length + ' remaining.', 'err');
    return;
  }
  const btn = $('[data-action="runner-submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Scoring…'; }
  try {
    const endpoint = r.type === 'checkup' ? '/api/checkup/submit'
      : '/api/module/' + encodeURIComponent(r.module_id) + '/assessment/' + r.type + '/submit';
    const data = await api(endpoint, { method: 'POST', body: JSON.stringify({ answers: r.answers }) });
    if (r.type === 'checkup') {
      state.checkupResult = data;
      state.progress = data.progress;
      state.runner = null;
      location.hash = '#/checkup';
      router();
    } else {
      state.assessmentResult = data;
      state.progress = data.progress;
      const moduleId = r.module_id;
      const kind = r.type;
      state.runner = null;
      viewTest(begin(), moduleId, kind);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Submit answers'; }
    toast(err.message, 'err');
  }
}

async function viewTest(my, sub, kind) {
  if (!sub) return viewTestHub(my);
  if (sub === 'quiz' || sub === 'scenario') {
    if (state.assessmentResult && state.assessmentResult.kind === sub) {
      renderAssessmentResult(state.assessmentResult, my);
      return;
    }
    await startAssessment(sub, 'strategy');
    return;
  }
  if (sub === 'practical') return viewPractical(my, 'strategy');

  const moduleId = sub;
  if (!kind) return viewTestModule(my, moduleId);
  if (kind === 'practical') return viewPractical(my, moduleId);
  if (kind === 'quiz' || kind === 'scenario') {
    if (state.assessmentResult && state.assessmentResult.kind === kind
        && state.assessmentResult.module && state.assessmentResult.module.id === moduleId) {
      renderAssessmentResult(state.assessmentResult, my);
      return;
    }
    await startAssessment(kind, moduleId);
    return;
  }
  notFound(my);
}

          <span class="small strong">${esc(l.title)}</span></span>${icon('right', 13)}</a>`).join('')}
      </div>
    </div>` : ''}

    <div class="section">
      <div class="section-head"><div><h2>Question feedback</h2><p>Every answer, with the reasoning. Use this to decide what to revise.</p></div></div>
      <div class="feedback-list">
        ${data.detail.map((d, i) => `<div class="feedback ${d.is_correct ? 'ok' : 'no'}">
          <div class="row-between" style="gap:10px"><span class="chip ${d.is_correct ? 'chip-teal' : 'chip-red'}">${d.is_correct ? 'Correct' : 'Review'}</span><span class="tiny muted">${esc(d.topic)}</span></div>
          <div class="fq" style="margin-top:7px">${i + 1}. ${esc(d.prompt)}</div>
          <div class="fa">Your answer: <b>${d.chosen != null ? esc(d.options[d.chosen]) : 'No answer'}</b></div>
          ${d.is_correct ? '' : `<div class="fa">Correct answer: <b>${esc(d.options[d.correct])}</b></div>`}
          <div class="fe">${esc(d.explanation)}${d.lesson ? ` · <a href="#/learn/${esc(moduleId)}/${esc(d.lesson.id)}">Revisit lesson ${d.lesson.number}: ${esc(d.lesson.title)}</a>` : ''}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="section card card-pad">
      <div class="row-between wrap" style="gap:12px">
        <div><h3 style="margin-bottom:4px">${passed ? 'Keep the momentum' : 'Revise, then retake'}</h3>
          <p class="small muted" style="margin:0">${passed ? 'Your result is saved. Complete the remaining criteria to finish the module.' : 'The exact lessons are listed above; retries are unlimited and your best pass is what counts.'}</p></div>
        <div class="row wrap">
          <a class="btn btn-outline" href="#/learn/${esc(moduleId)}">${icon('learn', 14)} Review lessons</a>
          <button class="btn btn-primary" type="button" data-action="retry-assessment" data-kind="${data.kind}" data-module="${esc(moduleId)}">${icon('refresh', 14)} Retry</button>
          ${passed ? `<a class="btn btn-teal" href="${nextHref}">${nextLabel} ${icon('right', 14)}</a>` : ''}
        </div>
      </div>
    </div>`, my);
}

/* ------------------------------------------------------------------ practical */
async function viewPractical(my, moduleId = 'strategy') {
  state.practicalModule = moduleId;
  const data = await api('/api/module/' + encodeURIComponent(moduleId) + '/practical');
  if (my !== seq) return;
  const sub = data.submission;
  const showForm = state.practicalForm || !sub || (sub.status === 'reviewed' && !sub.passed);
  const standard = data.standards;
  const moduleTitle = data.module.title;

  if (showForm) {
    const existing = sub ? sub.responses : {};
    mount(`
      <div class="row" style="gap:8px;margin-bottom:14px"><a class="link-arrow" href="#/test/${esc(moduleId)}">${icon('left', 13)} ${esc(moduleTitle)} assessments</a>
        <span class="chip chip-grey">Practical assignment</span></div>
      <div class="section-head" style="margin-top:0">
        <div><div class="eyebrow">Test Your Skills · ${esc(moduleTitle)}</div><h1>${esc(data.practical.title)}</h1>
        <p>${esc(data.practical.intro)}</p></div>
      </div>
      <div class="split">
        <div class="card card-pad">
          <form data-form="practical">
            <input type="hidden" name="module_id" value="${esc(moduleId)}">
            ${data.practical.prompts.map((pr, i) => `<div class="field">
              <label for="${pr.id}">${i + 1}. ${esc(pr.label)}</label>
              <textarea class="textarea" id="${pr.id}" name="${pr.id}" rows="5" placeholder="${esc(pr.placeholder)}" required minlength="30">${esc(existing[pr.id] || '')}</textarea>
              <div class="hint">Criterion: ${esc(data.practical.criteria.find(c => c.id === pr.criterion).label)} · minimum 30 characters</div>
            </div>`).join('')}
            <div class="row-between wrap" style="gap:10px">
              <span class="tiny muted">${icon('shield', 12)} Saved to your account. Reviewed by an administrator.</span>
              <button class="btn btn-primary" type="submit">Submit for review ${icon('right', 14)}</button>
            </div>
          </form>
        </div>
        <div>
          <div class="card card-pad">
            <h3 style="margin-bottom:10px">How it is scored</h3>
            ${data.practical.criteria.map(c => `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
              <div class="small strong">${esc(c.label)}</div><div class="tiny muted">${esc(c.hint)}</div></div>`).join('')}
            <p class="tiny muted" style="margin-top:12px">Each criterion is scored 0–4. Pass: average ≥ ${standard.rubric_min} with no criterion below ${standard.rubric_floor}. Your submission stays “awaiting review” until an administrator scores it — the module is not marked passed before then.</p>
          </div>
          <div class="card card-pad" style="margin-top:14px;background:#FFFBEF;border-color:#F2E5BB">
            <div class="row" style="gap:8px;margin-bottom:7px">${icon('alert', 15)}<b class="small">Use real numbers</b></div>
            <p class="tiny" style="color:#7A6420;margin:0">Write what is true for your business, including the parts you are unsure about. A specific, honest answer is easier to coach than a polished generic one.</p>
          </div>
        </div>
      </div>`, my);
    return;
  }

  const rubric = sub.rubric || {};
  mount(`
    <div class="row" style="gap:8px;margin-bottom:14px"><a class="link-arrow" href="#/test/${esc(moduleId)}">${icon('left', 13)} ${esc(moduleTitle)} assessments</a>
      <span class="chip chip-grey">Practical assignment</span></div>
    <div class="section-head" style="margin-top:0">
      <div><div class="eyebrow">Practical assignment · ${esc(moduleTitle)}</div><h1>${sub.status === 'reviewed' ? (sub.passed ? 'Reviewed and passed' : 'Reviewed — revision needed') : 'Submitted for review'}</h1>
        <p>Submitted ${fmtDate(sub.created_at)}${sub.reviewed_at ? ' · reviewed ' + fmtDate(sub.reviewed_at) : ''}.</p></div>
      <span class="chip ${sub.status === 'reviewed' ? (sub.passed ? 'chip-teal' : 'chip-red') : 'chip-yellow'}">${sub.status === 'reviewed' ? (sub.passed ? 'Verified pass' : 'Not passed') : 'Awaiting review'}</span>
    </div>
    ${sub.status === 'reviewed' ? `
    <div class="card card-pad" style="margin-bottom:16px">
      <div class="row-between wrap" style="gap:14px">
        <div><div class="eyebrow">Rubric result</div><h2 style="font-size:20px">${sub.average} / 4 average</h2>
          <p class="small muted" style="margin:4px 0 0">Pass mark: ${standard.rubric_min}/4 average, no criterion below ${standard.rubric_floor}.</p></div>
        <a class="btn btn-outline btn-sm" href="#/progress">View progress record ${icon('right', 13)}</a>
      </div>
      <div class="grid auto-220" style="margin-top:16px">
        ${data.practical.criteria.map(c => `<div class="card" style="padding:13px;box-shadow:none">
          <div class="row-between"><span class="tiny muted">${esc(c.label)}</span><b class="small">${rubric[c.id] != null ? rubric[c.id] : '—'}/4</b></div>
          <div style="margin-top:7px">${bar(((rubric[c.id] || 0) / 4) * 100)}</div>
        </div>`).join('')}
      </div>
      ${sub.reviewer_note ? `<div class="example-box" style="margin-bottom:0"><div class="lbl">Reviewer note</div><p>${esc(sub.reviewer_note)}</p></div>` : ''}
    </div>` : `
    <div class="demo-banner" style="margin-bottom:16px">${icon('clock', 16)}<div><b>Awaiting review.</b> A reviewer will score this against the rubric. Your module stays <b>not yet passed</b> until that happens — results are never invented automatically.</div></div>`}

    <div class="card card-pad">
      <div class="card-head"><div><h2>Your submission</h2><p>What you wrote, kept as the record of this attempt.</p></div>
        ${sub.status === 'reviewed' && !sub.passed ? `<button class="btn btn-primary btn-sm" type="button" data-action="revise-practical" data-module="${esc(moduleId)}">${icon('edit', 13)} Revise and resubmit</button>` : ''}</div>
      ${data.practical.prompts.map((pr, i) => `<div class="answer-block"><div class="k">${i + 1}. ${esc(pr.label)}</div><div class="v">${esc(sub.responses[pr.id] || '—')}</div></div>`).join('')}
    </div>`, my);
}

/* ------------------------------------------------------------------ progress */
async function viewProgress(my) {
  const p = await api('/api/progress');
  if (my !== seq) return;
  state.progress = p;
  const st = p.focus_module || p.module;
  const levels = ['Beginner', 'Developing', 'Structured', 'Optimising'];
  const levelIdx = levels.indexOf(p.mastery.level);
  const history = [];
  if (p.diagnostic) history.push({ name: 'Business Check-Up', kind: 'diagnostic', score: p.diagnostic.overall, passed: null, at: p.diagnostic.created_at });
  p.attempts.forEach(a => history.push({
    name: (a.module_title || compName(a.component)) + ' · ' + (a.kind === 'quiz' ? 'Knowledge quiz' : 'Scenario test'),
    kind: a.kind, score: a.score, passed: a.passed, at: a.created_at,
  }));
  p.modules.forEach(m => {
    if (m.practical) history.push({
      name: m.title + ' · Practical',
      kind: 'practical',
      score: m.practical.average != null ? m.practical.average + '/4' : '—',
      passed: m.practical.status === 'reviewed' ? m.practical.passed : null,
      at: m.practical.reviewed_at || m.practical.created_at,
      pending: m.practical.status === 'pending',
    });
  });
  history.sort((a, b) => new Date(b.at) - new Date(a.at));
  const trend = p.trend || [];
  const trendBest = trend.length ? Math.max(...trend.map(t => t.score)) : null;
  const trendPassed = trend.filter(t => t.passed).length;
  const focusCriteria = [
    { t: `Lessons (${st.lessons_done}/${st.lessons_total})`, s: 'Mark each lesson complete as you work through it', ok: st.lessons_done === st.lessons_total },
    { t: `Knowledge quiz (${st.quiz ? st.quiz.score + '%' : 'not passed'})`, s: `Pass mark ${st.standards.quiz_pass}%`, ok: st.quiz_passed },
    { t: `Scenario test (${st.scenario ? st.scenario.score + '%' : 'not passed'})`, s: `Pass mark ${st.standards.scenario_pass}%`, ok: st.scenario_passed },
    { t: `Practical (${st.practical ? (st.practical.average != null ? st.practical.average + '/4' : 'pending') : 'not submitted'})`, s: 'Reviewed against the module rubric', ok: st.practical_passed },
  ];

  mount(`
    <div class="section-head" style="margin-top:0">
      <div><div class="eyebrow">My Business Progress</div><h1>Your record, honestly kept.</h1>
      <p>Every score below comes from a stored assessment attempt or a reviewed practical. Unassessed areas are labelled, not guessed.</p></div>
      <div class="row wrap" style="gap:8px">
        <button class="btn btn-outline btn-sm" type="button" data-action="print-progress">${icon('download', 13)} Print / save PDF</button>
        <a class="btn btn-outline btn-sm" href="#/test">${icon('test', 13)} Go to assessments</a>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><div><h2>Five business aspects</h2><p>Your check-up grouped the way owners think about the business. Scores are self-assessed; a verified badge only appears where a module has been fully passed.</p></div></div>
      <div class="aspect-grid">
        ${ASPECTS.map((a) => {
          const s = aspectSummary(p, a);
          return `<div class="stat">
            <div class="k">${esc(a.label)}</div>
            <div class="v">${s.score != null ? s.score : '—'}<small>${s.score != null ? '%' : ''}</small></div>
            <div class="s">${s.score != null ? 'Self-assessed baseline' : (s.verified ? 'Verified module · check-up not taken' : 'Not assessed yet')}</div>
            <div style="margin-top:9px">${bar(s.score == null ? 0 : s.score)}</div>
            <p class="tiny muted" style="margin:8px 0 0;line-height:1.45">${esc(a.blurb)}</p>
            ${s.verified ? `<div style="margin-top:8px"><span class="chip chip-teal" style="font-size:9.5px;padding:2px 7px">${s.verified}/${s.total} verified</span></div>` : ''}
          </div>`;
        }).join('')}
      </div>
      <p class="tiny muted" style="margin-top:10px">Legal &amp; Risk is not part of these five owner-facing aspects; it is tracked in the detailed breakdown below.</p>
    </div>

    <div class="split">
      <div>
        <div class="card card-pad">
          <div class="row-between wrap" style="gap:20px">
            <div class="row" style="gap:20px">
              ${ring(p.overall_percent, 112, 9, 'overall', true)}
              <div>
                <div class="eyebrow" style="margin-bottom:4px">Current mastery</div>
                <h2 style="font-size:26px;margin-bottom:6px">${esc(p.mastery.level)}</h2>
                <p class="small muted" style="margin:0">${esc(p.mastery.basis)}</p>
                <div class="row wrap" style="gap:6px;margin-top:10px">
                  <span class="chip chip-navy">${p.modules_passed} of ${p.modules_total} modules passed</span>
                  <span class="chip chip-grey">${p.attempts.length} scored attempts</span>

              </div>

              <div class="level-labels" style="margin-bottom:6px"><span>Beginner</span><span>Optimising</span></div>

              </div>
              <p class="tiny muted" style="margin-top:8px">Beginner → Developing → Structured → Optimising, based on verified evidence.</p>
            </div>
          </div>
        </div>

        <div class="grid auto-220" style="margin-top:16px">
          <div class="stat"><div class="k">Diagnostic</div><div class="v">${p.diagnostic ? p.diagnostic.overall : '—'}<small>${p.diagnostic ? '%' : ''}</small></div><div class="s">${p.diagnostic ? fmtDate(p.diagnostic.created_at) : 'Not taken yet'}</div></div>

          <div><b style="color:#fff">Optimising</b> — modules verified with quiz ≥ 90%, practical ≥ 3.5/4 and a completed plan item.</div>

    <div class="section">

    <div class="section card card-pad">

function mdLite(text) {
  let safe = esc(text);
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const blocks = safe.split(/\n{2,}/);
  return blocks.map(block => {
    const lines = block.split('\n').filter(l => l.trim() !== '');
    if (lines.length && lines.every(l => /^[•\-]\s+/.test(l.trim()))) {
      return '<ul>' + lines.map(l => `<li>${l.replace(/^[•\-]\s+/, '')}</li>`).join('') + '</ul>';
    }
    if (lines.length && lines.every(l => /^\d+\.\s+/.test(l.trim()))) {
      return '<ol>' + lines.map(l => `<li>${l.replace(/^\d+\.\s+/, '')}</li>`).join('') + '</ol>';
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

  c.mode = data.session.mode;
  c.messages = data.messages.map(m => ({ role: m.role, content: m.content }));
  c.loaded = true;

}

  const c = state.coach;

function scrollChat() {
  const body = $('#chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}

async function sendCoach(text) {
  if (!text.trim() || state.coach.busy) return;
  const c = state.coach;
  c.messages.push({ role: 'user', content: text.trim() });
  c.busy = true;
  renderCoach(begin());
  try {
    const data = await api('/api/coach', {
      method: 'POST',
      body: JSON.stringify({ mode: c.mode, message: text.trim(), session_id: c.sessionId }),
    });
    c.sessionId = data.session_id;
    c.messages.push({ role: 'assistant', content: data.reply });
    c.busy = false;
    if (data.ai_error) toast('Live AI failed: ' + data.ai_error, 'err');
    if (data.session) {
      const summary = { ...data.session, message_count: c.messages.length, preview: data.reply.slice(0, 120) };
      c.sessions = [summary, ...c.sessions.filter(s => s.id !== data.session.id)];
    }
    renderCoach(begin());
  } catch (err) {
    c.busy = false;
    toast(err.message, 'err');
    renderCoach(begin());
  }
}

          <div class="field"><label>Explanation</label><input class="input" name="explanation" value="${esc(editing ? editing.explanation : '')}" placeholder="Why the answer is correct" required></div>
        </div>
        <label class="checkbox" style="margin-bottom:12px"><input type="checkbox" name="active" ${!editing || editing.active ? 'checked' : ''}> Active (included in assessments)</label>
        <button class="btn btn-primary btn-sm" type="submit">${icon('check', 13)} ${editing ? 'Save changes' : 'Create question'}</button>
      </form>` : ''}
      ${filtered.map(q => `<div class="q-row">
        <div class="row-between" style="gap:10px"><div class="qt">${esc(q.prompt)}</div>
          <div class="q-actions"><button class="btn btn-ghost btn-sm" type="button" data-action="admin-qedit" data-id="${esc(q.id)}">${icon('edit', 12)} Edit</button>

        <div class="qa">✓ ${esc(q.options[q.correct])}</div>
      </div>`).join('')}
      ${filtered.length === 0 ? `<div class="card"><div class="empty">No questions of this type.</div></div>` : ''}`, my);
    return;
  }

  const aiConfig = await api('/api/admin/ai');
  if (my !== seq) return;
  state.admin.ai = aiConfig;

  mount(`${headAdmin('Standards')}${tabs}
    <div class="split">
      <div class="card card-pad">

async function viewAdminContent(my, tabs) {
  const list = await api('/api/admin/modules');
  if (my !== seq) return;
  if (!state.admin.moduleId || !list.modules.some(m => m.id === state.admin.moduleId)) {
    state.admin.moduleId = list.modules.length ? list.modules[0].id : null;
  }
  let detail = null;
  if (state.admin.moduleId) {
    detail = await api('/api/admin/modules/' + encodeURIComponent(state.admin.moduleId));
    if (my !== seq) return;

  const module = detail ? detail.module : null;
  const lesson = module ? (module.lessons.find(l => l.id === state.admin.lesson) || module.lessons[0]) : null;
  const template = module && !state.admin.newTemplate
    ? (module.templates.find(t => t.slug === state.admin.template) || module.templates[0] || null)
    : null;

  mount(`${headAdmin('Content')}${tabs}
